<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Eren - live update dialog for Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226">
        <animate attributeName="stop-color" values="#0f1226;#1a1352;#0f1226" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2a1b6e">
        <animate attributeName="stop-color" values="#2a1b6e;#4f6af5;#2a1b6e" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9db8ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff8fc0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#ff6fb1"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="70" y="0" width="0" height="320">
        <animate attributeName="width" from="0" to="640" dur="2.2s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="30" fill="url(#bg)"/>

  <!-- floating blobs -->
  <g opacity="0.55">
    <circle cx="140" cy="60" r="70" fill="#4f6af5" opacity="0.25">
      <animate attributeName="cy" values="60;100;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="70;86;70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="270" r="90" fill="#ff6fb1" opacity="0.18">
      <animate attributeName="cy" values="270;236;270" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="50" r="50" fill="#70a0df" opacity="0.25">
      <animate attributeName="cx" values="980;1010;980" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="520" cy="46" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="290" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="270" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="140" font-size="96" font-weight="800" letter-spacing="6" fill="url(#title)" filter="url(#glow)">EREN</text>
    <g clip-path="url(#type)">
      <text x="72" y="190" font-size="27" font-weight="600" fill="#cdd6ff">Live update dialog for Android apps</text>
      <text x="72" y="228" font-size="19" fill="#9aa6e0">Design it on your phone. Ship it to every user in seconds.</text>
    </g>
    <g transform="translate(72 262)">
      <rect width="118" height="30" rx="15" fill="#ffffff" opacity="0.12"/>
      <text x="59" y="20" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Pure Java</text>
      <rect x="128" width="140" height="30" rx="15" fill="#ffffff" opacity="0.12"/>
      <text x="198" y="20" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Firebase RTDB</text>
      <rect x="278" width="122" height="30" rx="15" fill="#ffffff" opacity="0.12"/>
      <text x="339" y="20" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Single dex</text>
    </g>
  </g>

  <!-- floating dialog mock -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.5s" repeatCount="indefinite"/>
    <g transform="translate(880 26)">
      <rect width="210" height="268" rx="26" fill="#fffafd"/>
      <path d="M0 26 Q0 0 26 0 H184 Q210 0 210 26 V104 H0 Z" fill="url(#hero)"/>
      <rect y="70" width="210" height="34" fill="#fffafd" opacity="0.55"/>
      <circle cx="105" cy="52" r="20" fill="#fff" opacity="0.35">
        <animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="105" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#292a2d" text-anchor="middle">UPDATE</text>
      <text x="105" y="170" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-size="31" text-anchor="middle"><tspan fill="#4a1a2c">MOD</tspan><tspan fill="#e91e63">MASE</tspan></text>
      <rect x="18" y="184" width="174" height="38" rx="12" fill="#fff" stroke="#f0e6ea"/>
      <text x="30" y="200" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4a1a2c">&#10070; New Features Available</text>
      <text x="30" y="213" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4a1a2c">&#10070; Previous Bug Fixed</text>
      <rect x="14" y="232" width="86" height="26" rx="10" fill="#fff" stroke="#2a0d18" stroke-width="2"/>
      <text x="57" y="249" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#2a0d18" text-anchor="middle">EXIT</text>
      <rect x="108" y="232" width="88" height="26" rx="10" fill="#e91e63" stroke="#2a0d18" stroke-width="2"/>
      <rect x="104" y="228" width="96" height="34" rx="13" fill="none" stroke="#ff6fb1" stroke-width="2">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="152" y="249" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">UPDATE</text>
    </g>
  </g>
</svg>
