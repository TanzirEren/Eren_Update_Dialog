name: Build Eren + Eren Admin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Eren, ErenAdmin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-APK
          path: |
            ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
            ${{ matrix.project }}/app/build/outputs/apk/release/*.apk
