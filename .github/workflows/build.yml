name: Build release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_SDK_ROOT" || true
          yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug + release
        run: |
          gradle --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EREN_APP_APK
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
